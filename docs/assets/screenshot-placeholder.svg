<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <linearGradient id="zg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af7"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- VS Code chrome -->
  <rect x="0" y="0" width="1280" height="32" fill="#1e1e2e" rx="0"/>
  <text x="640" y="21" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">Zolttran — AI Game Studio</text>

  <!-- Sidebar (activity bar) -->
  <rect x="0" y="32" width="48" height="688" fill="#181825"/>
  <!-- Z icon in sidebar -->
  <rect x="12" y="52" width="24" height="24" rx="6" fill="url(#zg)"/>
  <text x="24" y="68" text-anchor="middle" fill="white" font-family="system-ui" font-weight="900" font-size="13">Z</text>

  <!-- Explorer panel -->
  <rect x="48" y="32" width="200" height="688" fill="#1e1e2e"/>
  <text x="60" y="58" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="11" font-weight="600" letter-spacing="1">ZOLTTRAN</text>

  <!-- Tab bar -->
  <rect x="248" y="32" width="800" height="40" fill="#1e1e2e"/>
  <!-- Tabs -->
  <rect x="248" y="32" width="120" height="40" fill="#2a2a3e"/>
  <text x="308" y="56" text-anchor="middle" fill="#7c6af7" font-family="system-ui" font-size="12">💬 Chat</text>
  <rect x="248" y="70" width="120" height="2" fill="#7c6af7"/>

  <text x="400" y="56" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="12">🤖 Agents</text>
  <text x="490" y="56" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="12">🎮 Builder</text>
  <text x="570" y="56" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="12">🚀 Deploy</text>
  <text x="650" y="56" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="12">⚙️ Config</text>

  <!-- Chat area -->
  <rect x="248" y="72" width="800" height="648" fill="#12121f"/>

  <!-- Welcome message -->
  <rect x="340" y="120" width="64" height="64" rx="16" fill="url(#zg)"/>
  <text x="372" y="160" text-anchor="middle" fill="white" font-size="28">🎮</text>

  <text x="372" y="210" text-anchor="middle" fill="url(#zg)" font-family="system-ui" font-size="22" font-weight="700">Zolttran</text>
  <text x="372" y="232" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="13">Hayallerini oyuna dönüştür. Tek bir cümleyle.</text>

  <!-- Starter buttons -->
  <rect x="280" y="260" width="180" height="44" rx="10" fill="rgba(124,106,247,0.1)" stroke="rgba(124,106,247,0.2)" stroke-width="1"/>
  <text x="290" y="278" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="11">🧛 Vampire Survivors klonu</text>
  <text x="290" y="294" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="10">bilim kurgu temalı</text>

  <rect x="475" y="260" width="160" height="44" rx="10" fill="rgba(124,106,247,0.1)" stroke="rgba(124,106,247,0.2)" stroke-width="1"/>
  <text x="485" y="278" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="11">🏃 2D platformer</text>
  <text x="485" y="294" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="10">wall jump özellikli</text>

  <!-- Chat message example -->
  <rect x="260" y="340" width="620" height="60" rx="12" fill="rgba(124,106,247,0.2)" stroke="rgba(124,106,247,0.3)" stroke-width="1"/>
  <text x="280" y="365" fill="rgba(255,255,255,0.9)" font-family="system-ui" font-size="13">Vampire Survivors benzeri bilim kurgu oyunu yap, düşmanlar uzaylı</text>
  <text x="280" y="385" fill="rgba(255,255,255,0.9)" font-family="system-ui" font-size="13">robotlar olsun, player lazer tabancası kullansın</text>

  <!-- AI response -->
  <rect x="268" y="420" width="24" height="24" rx="6" fill="url(#zg)"/>
  <text x="280" y="436" text-anchor="middle" fill="white" font-family="system-ui" font-weight="900" font-size="10">Z</text>

  <rect x="302" y="415" width="540" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="318" y="438" fill="rgba(255,255,255,0.9)" font-family="system-ui" font-size="13">🎮 Mükemmel! "Space Survivors" oyununuzu oluşturuyorum...</text>
  <text x="318" y="458" fill="#4ade80" font-family="system-ui" font-size="12">✓ Oyun Tasarım Dokümanı hazırlandı</text>
  <text x="318" y="476" fill="#7c6af7" font-family="system-ui" font-size="12">⚙ Geliştirici agent GDScript yazıyor... 67%</text>
  <text x="318" y="494" fill="#22d3ee" font-family="system-ui" font-size="12">🎨 Sanatçı agent sprite üretiyor...</text>

  <!-- Input bar -->
  <rect x="260" y="640" width="770" height="60" rx="12" fill="rgba(124,106,247,0.08)" stroke="rgba(124,106,247,0.2)" stroke-width="1"/>
  <text x="280" y="674" fill="rgba(255,255,255,0.25)" font-family="system-ui" font-size="13">Oyununu tarif et, soru sor veya hata yapıştır...</text>

  <!-- Status bar bottom -->
  <rect x="0" y="700" width="1280" height="20" fill="#0f0f1f"/>
  <text x="260" y="713" fill="rgba(255,255,255,0.4)" font-family="system-ui" font-size="10">🆓 FREE MODE  ·  ⚡ Tam Otonom  ·  $0.00  ·  Godot: Bağlı</text>
</svg>
