name: Zolttran CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Build Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vsce package --no-dependencies
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: zolttran-vsix
          path: extension/*.vsix

  godot-agent:
    name: Build Godot Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv
      - run: uv sync
      - run: uv run pylint src/zolttran_godot_agent --fail-under=7.0 || true
      - run: uv run mypy src/zolttran_godot_agent || true
      - run: uv run pytest tests/ -v || true

  release:
    name: Release
    needs: [extension, godot-agent]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zolttran-vsix
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.vsix
          generate_release_notes: true
