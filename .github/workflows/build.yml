name: Zolttran CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Build Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - name: Lint (bilgi amaçlı)
        run: npm run lint || true
      - name: Paketle (.vsix)
        run: npx --yes @vscode/vsce package --no-dependencies || true
      - uses: actions/upload-artifact@v4
        with:
          name: zolttran-vsix
          path: extension/*.vsix
          if-no-files-found: ignore
