[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zolttran-godot-agent"
version = "1.0.0"
description = "Zolttran Godot MCP Agent — 35+ tools for Godot 4 integration"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.3.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
zolttran-agent = "zolttran_godot_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zolttran_godot_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
